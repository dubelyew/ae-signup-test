<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AE KB audit: segment opt-in test</title>
</head>
<body>
<h1>AE KB audit: segment opt-in test</h1>
<p>Test page for the Appreciation Engine help center audit. Same register form as index.html, with an AE JS opt-in checkbox for segment 12434 (data-ae-optin and data-ae-optin-segmentid, from the AE JS Data Tags Reference).</p>

<script type="text/javascript" charset="utf-8" src="https://demo.theappreciationengine.com/framework/js/545"></script>
<script type="text/javascript" charset="utf-8">
  function AEJSReady(aeJS) {
    /* additional settings go here */
  }
</script>

<form data-ae-type="register" data-ae-register-form="email" data-ae-return="https://dubelyew.github.io/ae-signup-test/thanks.html">
  <label for="ae-email-signup-email">Email address</label>
  <input type="email" id="ae-email-signup-email" name="email" placeholder="Email address" required>

  <label for="ae-email-signup-password">Password</label>
  <input type="password" id="ae-email-signup-password" name="password" placeholder="Create a password" required>

  <label>
    <input type="checkbox" data-ae-optin data-ae-optin-segmentid="12434" value="Join the AE KB Audit Test Segment" checked>
    Join the AE KB Audit Test Segment
  </label>

  <button type="submit">Sign up</button>
</form>
</body>
</html>
