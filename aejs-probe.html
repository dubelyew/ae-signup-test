<script type="text/javascript" charset="utf-8">
function keys(o){ try { return Object.keys(o||{}).sort(); } catch(e){ return ['ERR '+e]; } }
function AEJSReady(aeJS){
  window.globalAEJS = aeJS;
  var r = {top: keys(aeJS), events: keys(aeJS.events), settings: {}, get: keys(aeJS.get), trigger: keys(aeJS.trigger), methods: keys(aeJS.methods), user: aeJS.user ? keys(aeJS.user) : null, version: aeJS.version || null};
  var s = aeJS.settings || {}; for (var k in s) { var v = s[k]; r.settings[k] = (typeof v === 'object' && v) ? JSON.stringify(v).slice(0,120) : String(v); }
  var evs = aeJS.events || {}; r.eventDetail = {}; for (var e in evs) { r.eventDetail[e] = keys(evs[e]); }
  window.__probe = r;
  document.getElementById('out').textContent = JSON.stringify(r, null, 1);
}
